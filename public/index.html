<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wingmate — Gestion des groupes</title>
<link rel="icon" type="image/png" href="wingmate-crest.png">
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

html, body {
  margin: 0;
  padding: 0;
  background: #090c16;
  min-height: 100%;
}

.gm-root {
  --bg: #090c16;
  --bg-2: #0d1220;
  --panel: rgba(24, 30, 51, 0.62);
  --panel-solid: #141a2e;
  --border: rgba(139, 130, 255, 0.16);
  --border-strong: rgba(139, 130, 255, 0.32);
  --violet: #8b6bff;
  --blue: #45c1ff;
  --text: #e7e9f7;
  --muted: #8790ac;
  --muted-2: #5c6482;
  --tank: #4f9dff;
  --healer: #35d29a;
  --dps: #ff6b7a;
  --support: #f6c552;
  --danger: #ef4d5f;
  --success: #35d29a;
  --new: #ffb84f;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(1200px 800px at 15% -10%, rgba(139,107,255,0.14), transparent 60%),
              radial-gradient(1000px 700px at 100% 10%, rgba(69,193,255,0.08), transparent 55%),
              var(--bg);
  color: var(--text);
  min-height: 100vh;
  width: 100%;
  box-sizing: border-box;
  padding: 0;
  position: relative;
}
.gm-root *, .gm-root *:before, .gm-root *:after { box-sizing: border-box; }
.gm-root h1, .gm-root h2, .gm-root h3, .gm-root .gm-font-display {
  font-family: 'Cinzel', serif;
  letter-spacing: 0.02em;
}
.gm-mono { font-family: 'JetBrains Mono', monospace; }

.gm-shell { display: flex; min-height: 100vh; }

/* ---- Écran de connexion Discord obligatoire ---- */
.gm-gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.gm-gate-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
  padding: 36px 32px; max-width: 400px; width: 100%; text-align: center; backdrop-filter: blur(6px);
}
.gm-gate-logo { max-width: 220px; width: 100%; height: auto; margin: 0 auto 22px; display: block; }
.gm-gate-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 600; margin: 0 0 10px; }
.gm-gate-text { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0 0 22px; }
.gm-gate-text strong { color: var(--text); }
.gm-lang-switch { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
.gm-lang-switch button { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter'; display: inline-flex; align-items: center; gap: 6px; }
.gm-lang-switch button img { width: 16px; height: 12px; object-fit: cover; border-radius: 2px; display: block; }
.gm-lang-switch button.active { border-color: var(--border-strong); color: var(--text); background: rgba(139,107,255,0.12); }
.gm-role-box .gm-lang-switch { gap: 6px; }
.gm-role-box .gm-lang-switch button { flex: 1; padding: 6px 4px; font-size: 11px; justify-content: center; }

/* ---- Sidebar ---- */
.gm-sidebar {
  width: 220px;
  flex-shrink: 0;
  background: linear-gradient(180deg, rgba(20,26,46,0.9), rgba(13,18,32,0.9));
  border-right: 1px solid var(--border);
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.gm-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 0 2px; }
.gm-brand-logo { width: 100%; max-width: 172px; height: auto; display: block; }
.gm-brand-sub { font-size: 10px; color: var(--muted); font-family:'Inter'; font-weight:500; letter-spacing:0.08em; text-transform: uppercase; padding-left: 2px; }
.gm-mobile-topbar .gm-brand { flex-direction: row; align-items: center; }
.gm-mobile-topbar .gm-brand-logo { width: auto; max-width: none; height: 32px; }

.gm-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.gm-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--muted); font-size: 13.5px; font-weight: 500;
  cursor: pointer; border: 1px solid transparent; transition: all .15s ease;
  user-select: none;
}
.gm-nav-item:hover { background: rgba(139,107,255,0.08); color: var(--text); }
.gm-nav-item.active {
  background: rgba(139,107,255,0.14);
  border-color: var(--border-strong);
  color: var(--text);
  box-shadow: inset 2px 0 0 var(--violet);
}
.gm-nav-icon { width: 16px; text-align:center; opacity: 0.9; }

.gm-role-box {
  margin-top: auto;
  background: var(--panel-solid);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
}
.gm-user-badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px;
  padding: 6px 8px;
}
.gm-user-badge img { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--border-strong); }
.gm-user-badge-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-user-badge-logout { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 4px; line-height: 1; flex-shrink: 0; }
.gm-user-badge-logout:hover { color: var(--danger); }
.gm-role-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.gm-role-switch { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 3px; gap: 3px; }
.gm-role-switch button {
  flex: 1; border: none; background: transparent; color: var(--muted);
  padding: 7px 4px; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer;
  font-family: 'Inter'; transition: all .15s ease;
}
.gm-role-switch button.active { background: linear-gradient(135deg, var(--violet), var(--blue)); color: #060810; }

/* ---- Main ---- */
.gm-main { flex: 1; min-width: 0; padding: 26px 30px 60px; }
.gm-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px;}
.gm-page-title { font-size: 22px; font-weight: 600; }
.gm-page-sub { color: var(--muted); font-size: 13px; margin-top: 3px; font-family:'Inter'; }

.gm-search { position: relative; }
.gm-search input {
  background: var(--panel-solid); border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 14px 9px 32px; color: var(--text); font-size: 13px; width: 230px; outline: none;
  font-family: 'Inter';
}
.gm-search input:focus { border-color: var(--border-strong); }
.gm-search:before { content: '⚲'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%) rotate(90deg); color: var(--muted); font-size: 12px; }

.gm-btn {
  border: 1px solid var(--border-strong); background: rgba(139,107,255,0.1); color: var(--text);
  padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: 'Inter'; display: inline-flex; align-items: center; gap: 6px; transition: all .15s ease;
  white-space: nowrap;
}
.gm-btn:hover { background: rgba(139,107,255,0.2); }
.gm-btn-primary { background: linear-gradient(135deg, var(--violet), var(--blue)); border: none; color: #060810; }
.gm-btn-primary:hover { filter: brightness(1.08); }
.gm-btn-danger { background: rgba(239,77,95,0.12); border-color: rgba(239,77,95,0.4); color: #ff8b96; }
.gm-btn-danger:hover { background: rgba(239,77,95,0.22); }
.gm-btn-ghost { background: transparent; border-color: var(--border); }
.gm-btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
.gm-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---- Panels / Cards ---- */
.gm-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  backdrop-filter: blur(6px);
}

/* ---- Dashboard ---- */
.gm-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; margin-bottom: 20px; }
.gm-stat-card { padding: 16px; }
.gm-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600; background: linear-gradient(135deg, #fff, var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.gm-stat-label { color: var(--muted); font-size: 12px; margin-top: 4px; }
.gm-dash-row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .gm-dash-row { grid-template-columns: 1fr; } }
.gm-bar-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: 12.5px; }
.gm-bar-label { width: 110px; flex-shrink: 0; color: var(--muted); }
.gm-bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; }
.gm-bar-fill { height: 100%; border-radius: 6px; }
.gm-bar-value { width: 26px; text-align: right; font-family: 'JetBrains Mono'; color: var(--text); }

/* ---- Class badge / pill ---- */
.gm-class-pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px;
  border-radius: 20px; font-size: 11.5px; font-weight: 600; border: 1px solid;
  white-space: nowrap;
}
.gm-class-dot { width: 7px; height: 7px; border-radius: 50%; }
.gm-badge-new {
  background: rgba(255,184,79,0.14); color: var(--new); border: 1px solid rgba(255,184,79,0.4);
  font-size: 9px; font-weight: 700; padding: 1px 6px 1px 3px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.03em;
  display: inline-flex; align-items: center; gap: 2px;
}
.gm-badge-new img { width: 10px; height: 10px; object-fit: contain; flex-shrink: 0; }
.gm-role-tag { font-size: 10px; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.05em; }
.gm-avail-dot { width: 8px; height: 8px; border-radius: 50%; display:inline-block; margin-right: 5px; }

/* ---- Player cards grid ---- */
.gm-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.gm-select {
  background: var(--panel-solid); border: 1px solid var(--border); color: var(--text);
  padding: 8px 10px; border-radius: 9px; font-size: 12.5px; font-family: 'Inter'; outline: none;
}
.gm-players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.gm-player-card { padding: 14px; position: relative; overflow: hidden; transition: transform .15s ease, border-color .15s ease; }
.gm-player-card-icon {
  position: absolute;
  right: -12px; bottom: -12px;
  width: 128px; height: 128px;
  object-fit: contain;
  opacity: 0.5;
  z-index: -1;
  pointer-events: none;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
}
.gm-player-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.gm-player-top { display: flex; gap: 10px; align-items: flex-start; }
.gm-avatar {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
  border: 2px solid var(--border-strong); background: #222840;
}
.gm-avatar-fallback {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, var(--violet), var(--blue)); font-weight: 700; color: #0a0e1a; font-family:'Cinzel'; border: 2px solid var(--border-strong);
}
.gm-player-names { flex: 1; min-width: 0; }
.gm-player-pseudo { font-weight: 600; font-size: 14.5px; }
.gm-player-discord { color: var(--muted); font-size: 11.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-player-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.gm-player-avail { display: flex; gap: 12px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.gm-player-actions { display: flex; gap: 6px; margin-top: 12px; }

/* ---- Group slot ---- */
.gm-group-card { padding: 16px; margin-bottom: 18px; }
.gm-group-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.gm-group-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gm-group-name { font-family: 'Cinzel'; font-size: 16px; font-weight: 600; background: transparent; border: none; color: var(--text); outline: none; border-bottom: 1px dashed transparent; }
.gm-group-name:focus { border-bottom: 1px dashed var(--border-strong); }
.gm-group-meta-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
.gm-group-meta-inputs input {
  background: var(--panel-solid); border: 1px solid var(--border); color: var(--text);
  padding: 6px 9px; border-radius: 8px; font-size: 12px; outline: none; font-family:'Inter';
}
.gm-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
@media (max-width: 900px) { .gm-slots { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .gm-slots { grid-template-columns: 1fr; } }

.gm-slot {
  border: 1.5px dashed var(--border); border-radius: 12px; padding: 8px; min-height: 88px;
  display: flex; flex-direction: column; justify-content: space-between; position: relative;
  background: rgba(255,255,255,0.015);
}
.gm-slot.filled { border-style: solid; border-color: var(--border-strong); background: rgba(139,107,255,0.05); }
.gm-slot-num { font-size: 9.5px; color: var(--muted-2); font-family:'JetBrains Mono'; margin-bottom: 4px; }
.gm-slot-empty { flex: 1; display: flex; align-items: center; justify-content: center; }
.gm-slot select {
  width: 100%; background: var(--panel-solid); border: 1px solid var(--border); color: var(--text);
  padding: 6px 7px; border-radius: 8px; font-size: 11.5px; outline: none; font-family:'Inter';
}
.gm-slot-filled-body { display: flex; align-items: center; gap: 8px; }
.gm-slot-filled-body img, .gm-slot-filled-body .gm-avatar-fallback { width: 28px; height: 28px; font-size: 11px; }
.gm-slot-remove { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; line-height:1; padding: 2px;}
.gm-slot-remove:hover { color: var(--danger); }
.gm-slot-classoverride { margin-top: 6px; }
.gm-slot-classoverride select { padding: 4px 6px; font-size: 10.5px; }
.gm-slot-warning { font-size: 10px; color: var(--new); margin-top: 5px; display:flex; align-items:center; gap:3px; }

.gm-balance-row { display: flex; gap: 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
.gm-balance-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.gm-balance-count { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 14px; }
.gm-alert-chip { background: rgba(239,77,95,0.13); border: 1px solid rgba(239,77,95,0.4); color: #ff8b96; padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; }
.gm-group-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

/* ---- Modal ---- */
.gm-modal-overlay { position: fixed; inset: 0; background: rgba(4,6,12,0.72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.gm-modal { background: var(--panel-solid); border: 1px solid var(--border-strong); border-radius: 16px; padding: 24px; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; }
.gm-modal h3 { margin: 0 0 16px; font-size: 17px; }
.gm-form-row { margin-bottom: 13px; }
.gm-form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
.gm-form-row input, .gm-form-row select {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
  padding: 9px 11px; border-radius: 9px; font-size: 13px; outline: none; font-family:'Inter';
}
.gm-form-row input:focus, .gm-form-row select:focus { border-color: var(--border-strong); }
.gm-form-error { color: var(--danger); font-size: 11.5px; margin-top: 4px; }
.gm-form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gm-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.gm-discord-status { font-size: 11.5px; padding: 6px 10px; border-radius: 8px; margin-top: 8px; }
.gm-discord-status.ok { background: rgba(53,210,154,0.12); color: var(--success); }
.gm-discord-status.err { background: rgba(239,77,95,0.12); color: #ff8b96; }
.gm-discord-status.loading { background: rgba(69,193,255,0.1); color: var(--blue); }

/* ---- Toast ---- */
.gm-toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; }
.gm-toast { background: var(--panel-solid); border: 1px solid var(--border-strong); border-left: 3px solid var(--success); border-radius: 10px; padding: 11px 16px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: gm-toast-in .2s ease; }
@keyframes gm-toast-in { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }

/* ---- Empty state ---- */
.gm-empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.gm-empty-crest { width: 50px; height: 50px; margin: 0 auto 14px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: rgba(139,107,255,0.15); border: 1px dashed var(--border-strong); }

/* ---- Table (players list alt / classes admin) ---- */
.gm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.gm-table th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.gm-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
.gm-table tr:hover td { background: rgba(255,255,255,0.02); }
.gm-color-swatch { width: 16px; height: 16px; border-radius: 5px; display: inline-block; vertical-align: middle; }

.gm-tabs-sub { display: flex; gap: 6px; margin-bottom: 18px; }
.gm-tabs-sub button {
  background: var(--panel-solid); border: 1px solid var(--border); color: var(--muted);
  padding: 7px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family:'Inter';
}
.gm-tabs-sub button.active { color: var(--text); border-color: var(--border-strong); background: rgba(139,107,255,0.14); }

.gm-note { font-size: 11.5px; color: var(--muted-2); margin-top: 4px; line-height: 1.5; }
.gm-scrollx { overflow-x: auto; }

/* Mobile sidebar collapse */
.gm-mobile-topbar { display: none; }
@media (max-width: 780px) {
  .gm-shell { flex-direction: column; }
  .gm-sidebar { display: none; }
  .gm-sidebar.open { display: flex; position: fixed; z-index: 500; top:0; left:0; bottom:0; }
  .gm-mobile-topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .gm-main { padding: 16px; }
}
</style>

<div class="gm-root" id="gm-app"></div>

<script>
(function(){

/* =========================================================
   DONNÉES DE DÉMONSTRATION
========================================================= */

const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const DEFAULT_CLASSES = [
  { id: 'c1', name: 'Gladiateur', color: '#ff8f6b', icon: 'classes/gladiator.png', order: 1 },
  { id: 'c2', name: 'Templier', color: '#4f9dff', icon: 'classes/templar.png', order: 2 },
  { id: 'c3', name: 'Assassin', color: '#ff6b7a', icon: 'classes/assassin.png', order: 3 },
  { id: 'c4', name: 'Rôdeur', color: '#7ed957', icon: 'classes/ranger.png', order: 4 },
  { id: 'c5', name: 'Sorcier', color: '#8b6bff', icon: 'classes/sorcerer.png', order: 5 },
  { id: 'c6', name: 'Spiritualiste', color: '#45c1ff', icon: 'classes/spiritmaster.png', order: 6 },
  { id: 'c7', name: 'Clerc', color: '#f6c552', icon: 'classes/cleric.png', order: 7 },
  { id: 'c8', name: 'Aède', color: '#ff6bd0', icon: 'classes/chanter.png', order: 8 },
];
let CLASSES = DEFAULT_CLASSES.slice();

// Traduction des noms des 8 classes par défaut (identifiées par leur id).
// Une classe personnalisée créée par un joueur (id différent) garde simplement
// son nom tel quel, dans les deux langues.
const CLASS_NAME_I18N = {
  c1: { fr: 'Gladiateur', en: 'Gladiator' },
  c2: { fr: 'Templier', en: 'Templar' },
  c3: { fr: 'Assassin', en: 'Assassin' },
  c4: { fr: 'Rôdeur', en: 'Ranger' },
  c5: { fr: 'Sorcier', en: 'Sorcerer' },
  c6: { fr: 'Spiritualiste', en: 'Spiritmaster' },
  c7: { fr: 'Clerc', en: 'Cleric' },
  c8: { fr: 'Aède', en: 'Chanter' },
};
function className(c){
  if (!c) return '?';
  const map = CLASS_NAME_I18N[c.id];
  if (map) return map[LANG] || map.fr;
  return c.name;
}

// Données de démonstration désactivées : la liste des joueurs est vide au premier
// démarrage. Utilisez la synchronisation Discord (rôle configuré, "Aion 2" par défaut)
// ou le formulaire "Nouveau joueur" pour la peupler.
let PLAYERS = [];

function mkGroup(type, name, slotPseudos) {
  const findId = (pseudo) => { const p = PLAYERS.find(pl => pl.pseudo === pseudo); return p ? p.id : null; };
  const slots = [0,1,2,3,4].map(i => ({ playerId: slotPseudos[i] ? findId(slotPseudos[i]) : null }));
  return { id: uid('g'), type, name, slots };
}

function getCookie(name){
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function setCookie(name, value){
  document.cookie = `${name}=${encodeURIComponent(value)};path=/;max-age=${365*24*3600}`;
}

let LANG = getCookie('wingmate_lang') || 'fr';

function setLang(lang){
  LANG = lang;
  setCookie('wingmate_lang', lang);
  render();
}

function t(key, vars){
  let str = (I18N[LANG] && I18N[LANG][key]) || I18N.fr[key] || key;
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.split(`{${k}}`).join(vars[k]); });
  }
  return str;
}
function tStatus(status){
  return status === 'Nouveau joueur' ? t('status.new') : t('status.confirmed');
}
function tCount(n, key){
  return t(n > 1 ? key + '_other' : key + '_one', { n });
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cls(id){ return CLASSES.find(c => c.id === id); }
function player(id){ return PLAYERS.find(p => p.id === id); }
// Accès libre : plus de distinction Admin/Joueur, tout le monde a les mêmes droits.
function isAdmin(){ return true; }

function toast(msg, tone){
  const id = uid('t');
  TOASTS.push({ id, msg, tone: tone || 'success' });
  render();
  setTimeout(() => { TOASTS = TOASTS.filter(t => t.id !== id); render(); }, 3000);
}

/* ---- Sauvegarde automatique côté backend (fichier data.json local) ---- */
let SAVE_TIMER = null;
let LAST_SAVE_STATUS = null; // 'ok' | 'error' | null
function scheduleSave(){
  if (!DISCORD_API_BASE_URL || !SESSION_USER) return;
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(() => {
    fetch(`${DISCORD_API_BASE_URL.replace(/\/$/, '')}/api/state`, {
      method: 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ players: PLAYERS, classes: CLASSES, groups: GROUPS }),
    })
      .then(r => {
        if (r.status === 401) { SESSION_USER = null; render(); return; }
        LAST_SAVE_STATUS = r.ok ? 'ok' : 'error';
      })
      .catch(() => { LAST_SAVE_STATUS = 'error'; });
  }, 600);
}

function checkSession(){
  if (!DISCORD_API_BASE_URL) { SESSION_USER = null; SESSION_CHECKED = true; return Promise.resolve(); }
  return fetch(`${DISCORD_API_BASE_URL.replace(/\/$/, '')}/api/session`, { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : { authenticated: false })
    .then(data => { SESSION_USER = data.authenticated ? data.user : null; })
    .catch(() => { SESSION_USER = null; })
    .finally(() => { SESSION_CHECKED = true; });
}

function loadStateThenRender(){
  if (!DISCORD_API_BASE_URL || !SESSION_USER) { render(); return; }
  fetch(`${DISCORD_API_BASE_URL.replace(/\/$/, '')}/api/state`, { credentials: 'same-origin' })
    .then(r => {
      if (r.status === 401) { SESSION_USER = null; render(); return null; }
      return r.ok ? r.json() : null;
    })
    .then(data => {
      if (!data) { render(); return; }
      const hasSaved = data && ((data.players && data.players.length) || (data.classes && data.classes.length) || (data.groups && data.groups.length));
      if (hasSaved) {
        PLAYERS = data.players || [];
        // Un tableau vide ([]) est "vrai" en JS, donc on vérifie sa longueur
        // explicitement pour ne pas perdre les classes par défaut avec leurs icônes.
        CLASSES = (data.classes && data.classes.length) ? data.classes : DEFAULT_CLASSES.slice();
        GROUPS = data.groups || [];
        LAST_SAVE_STATUS = 'ok';
      } else {
        // Rien de sauvegardé encore : on garde les données de démonstration
        // et on les envoie tout de suite au backend pour initialiser data.json.
        scheduleSave();
      }
      maybeShowOnboarding();
      render();
    })
    .catch(() => { LAST_SAVE_STATUS = 'error'; render(); });
}

// À la toute première connexion, le profil du joueur n'a pas encore de classe :
// on lui demande de la choisir, ainsi que son statut, avant de continuer.
function maybeShowOnboarding(){
  if (!SESSION_USER || MODAL) return;

function confirmOnboarding(){

  const p = player(MODAL.playerId);

function avatarHtml(p, size){
  size = size || 34;
  if (p && p.discordAvatar) {
    return `<img class="gm-avatar" style="width:${size}px;height:${size}px" src="${esc(p.discordAvatar)}" alt="${esc(p.pseudo)}">`;
  }
  const initials = p ? p.pseudo.slice(0,2).toUpperCase() : '?';
  return `<div class="gm-avatar-fallback" style="width:${size}px;height:${size}px">${esc(initials)}</div>`;
}

function isImagePath(icon){
  return !!icon && /\.(png|jpg|jpeg|webp|svg|gif)$/i.test(icon);
}
function classIconHtml(icon, size){
  size = size || 14;
  if (!icon) return '';
  if (isImagePath(icon)) return `<img src="${esc(icon)}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:-3px;">`;
  return esc(icon);
}
function classPill(classId, overrideName){
  const c = cls(classId);
  if (!c && !overrideName) return `<span class="gm-class-pill" style="border-color:var(--border);color:var(--muted)">—</span>`;
  const name = overrideName || (c ? className(c) : '?');
  const color = c ? c.color : '#888';
  return `<span class="gm-class-pill" style="border-color:${color}66;background:${color}1c;color:${color}">
    ${c ? classIconHtml(c.icon, 15) : ''} ${esc(name)}
  </span>`;
}

/* group membership warning: is player in another group of same type? */
function groupsContainingPlayer(playerId, type, excludeGroupId){
  return GROUPS.filter(g => g.type === type && g.id !== excludeGroupId &&
    g.slots.some(s => s.playerId === playerId));
}

function savePlayerForm(){
  const f = MODAL.form;
  const pseudo = (f.pseudo || '').trim();
  if (!pseudo) { MODAL.error = t('playermodal.error_pseudo_required'); render(); return; }
  const dup = PLAYERS.find(p => p.pseudo.toLowerCase() === pseudo.toLowerCase() && p.id !== MODAL.editingId);
  if (dup) { MODAL.error = t('playermodal.error_pseudo_taken'); render(); return; }
  if (MODAL.editingId) {
    const idx = PLAYERS.findIndex(p => p.id === MODAL.editingId);
    PLAYERS[idx] = { ...PLAYERS[idx], ...f, pseudo };
    toast(t('toast.profile_updated'));
  } else {
    PLAYERS.push({ id: uid('p'), ...f, pseudo });
    toast(t('toast.player_added'));
  }
  MODAL = null;
  render();
}

function uniquePseudo(base){
  let candidate = base;
  let i = 2;
  while (PLAYERS.find(p => p.pseudo.toLowerCase() === candidate.toLowerCase())) {
    candidate = `${base} (${i})`; i++;
  }
  return candidate;
}

function connectWithDiscord(){
  if (!DISCORD_API_BASE_URL) { toast(t('toast.connect_configure_backend'), 'danger'); return; }
  window.location.href = `${DISCORD_API_BASE_URL.replace(/\/$/, '')}/auth/discord/login`;
}

function logoutDiscord(){
  if (!DISCORD_API_BASE_URL) return;
  window.location.href = `${DISCORD_API_BASE_URL.replace(/\/$/, '')}/auth/discord/logout`;
}

function handleDiscordLoginRedirect(){
  const params = new URLSearchParams(window.location.search);
  const status = params.get('discord_login');
  if (!status) return;
  const reason = params.get('reason');
  if (status === 'success') {
    toast(t('toast.discord_login_success'));
  } else if (status === 'denied') {
    const messages = {
      not_member: t('toast.discord_denied_not_member'),
      missing_role: t('toast.discord_denied_missing_role'),
      cancelled: t('toast.discord_denied_cancelled'),
    };
    toast(messages[reason] || t('toast.discord_access_denied'), 'danger');
  } else if (status === 'error') {
    const messages = {
      guild_not_configured: t('toast.discord_error_guild_not_configured'),
      server_misconfigured: t('toast.discord_error_server_misconfigured'),
      role_not_found: t('toast.discord_error_role_not_found'),
      token_exchange_failed: t('toast.discord_error_token_exchange_failed'),
    };
    toast(messages[reason] || t('toast.discord_error_generic'), 'danger');
  }
  // Nettoie l'URL pour ne pas garder les paramètres après le message.
  const url = new URL(window.location.href);
  url.searchParams.delete('discord_login');
  url.searchParams.delete('reason');
  window.history.replaceState({}, '', url.toString());
}

function openDiscordConfigModal(){
  MODAL = { type: 'discordConfig', form: { url: DISCORD_API_BASE_URL }, status: null };
  render();
}
function saveDiscordConfig(){
  DISCORD_API_BASE_URL = (MODAL.form.url || '').trim();
  toast(DISCORD_API_BASE_URL ? t('toast.backend_configured') : t('toast.backend_demo_mode'));

}
function testDiscordConfig(){
  const url = (MODAL.form.url || '').trim();
  if (!url) { MODAL.status = { tone: 'err', text: t('discordcfg.enter_url') }; render(); return; }
  MODAL.status = { tone: 'loading', text: t('discordcfg.testing') };
  render();
  fetch(`${url.replace(/\/$/, '')}/api/health`)
    .then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        MODAL.status = { tone: 'ok', text: t('discordcfg.success', { status: data.botTokenConfigured ? t('discordcfg.token_configured') : t('discordcfg.token_missing') }) };
      } else {
        MODAL.status = { tone: 'err', text: t('discordcfg.unexpected') };
      }
      render();
    })
    .catch(() => { MODAL.status = { tone: 'err', text: t('discordcfg.unreachable') }; render(); });
}

function createGroup(type, kind){
  const count = GROUPS.filter(g => g.type === type).length;
  const defaultName = (type === 'event' ? 'Event ' : 'Groupe ') + (count + 1);
  const slotCount = (type === 'event' && kind === 'sanctuary') ? 10 : 5;
  const g = { id: uid('g'), type, name: defaultName, activity: '', date: '', time: '',
    eventKind: type === 'event' ? (kind || 'expedition') : undefined,
    slots: Array.from({ length: slotCount }, () => ({ playerId: null })) };
  GROUPS.push(g);
  toast(t('toast.group_created'));
  render();
}
function openEventKindModal(){
  MODAL = { type: 'eventKind' };
  render();
}
function createEventWithKind(kind){
  MODAL = null;
  createGroup('event', kind);
}
function deleteGroup(groupId){
  const g = GROUPS.find(x => x.id === groupId);
  MODAL = { type: 'confirm', title: t('confirm.delete_group_title'), message: t('confirm.delete_group_msg', { name: g.name }),
    onConfirm: () => {
      MODAL = null; render();
      const finish = () => { GROUPS = GROUPS.filter(x => x.id !== groupId); toast(t('toast.group_deleted'), 'danger'); render(); };
      if (g.discordMessageId && DISCORD_API_BASE_URL) {
        fetch(`${DISCORD_API_BASE_URL.replace(/\/$/, '')}/api/groups/${groupId}`, { method: 'DELETE', credentials: 'same-origin' })
          .then(finish)
          .catch(finish); // même si la requête échoue, on retire quand même le groupe côté site
      } else {
        finish();
      }
    }
  };
  render();
}
function setSlotPlayer(groupId, slotIdx, playerId){
  const g = GROUPS.find(x => x.id === groupId);
  g.slots[slotIdx].playerId = playerId || null;
  render();
}
function removeSlotPlayer(groupId, slotIdx){
  setSlotPlayer(groupId, slotIdx, null);
  toast(t('toast.slot_removed'));
}
function updateGroupField(groupId, field, value){
  const g = GROUPS.find(x => x.id === groupId);
  g[field] = value;
}

let PUBLISHING_GROUP_ID = null;
function publishGroupToDiscord(groupId){
  if (!DISCORD_API_BASE_URL) { toast(t('toast.connect_configure_backend'), 'danger'); return; }
  PUBLISHING_GROUP_ID = groupId;
  render();
  fetch(`${DISCORD_API_BASE_URL.replace(/\/$/, '')}/api/groups/${groupId}/publish`, {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({}),
  })
    .then(async (res) => {
      const data = await res.json().catch(() => ({}));
      PUBLISHING_GROUP_ID = null;
      if (!res.ok) {
        const messages = {
          channel_missing: t('toast.publish_channel_missing'),
          bot_offline: t('toast.publish_bot_offline'),
          not_found: t('toast.publish_not_found'),
          invalid_channel: t('toast.publish_invalid_channel'),
          publish_failed: t('toast.publish_failed'),
        };
        toast(data.message || messages[data.error] || t('toast.publish_failed'), 'danger');
        render();
        return;
      }
      const g = GROUPS.find(x => x.id === groupId);
      if (g) { g.discordChannelId = data.channelId; g.discordMessageId = data.messageId; }
      toast(t('toast.publish_success'));
      render();
    })
    .catch(() => {
      PUBLISHING_GROUP_ID = null;
      toast(t('toast.publish_failed'), 'danger');
      render();
    });
}

/* =========================================================
   EVENTS
========================================================= */

function bindEvents(){
  const root = document.getElementById('gm-app');

  root.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');

    if (action === 'close-modal') {
      // N'accepte de fermer que si le clic (mousedown ET mouseup/click) a
      // commencé et fini exactement sur cet élément. Cela évite qu'une
      // sélection de texte glissée depuis un champ (ex: identifiant Discord)
      // et relâchée hors de la fenêtre ne ferme la modale par erreur.
      let downOnSelf = false;
      el.addEventListener('mousedown', (e) => { downOnSelf = (e.target === el); });
      el.addEventListener('click', (e) => {
        if (!downOnSelf) return;
        if (e.target !== el) return;
        handleClick(action, el, e);
      });
      return;
    }

    if (['nav','edit-player','new-class','edit-class','delete-class',
         'new-group','delete-group','remove-slot','publish-group','open-event-kind','pick-event-kind',
         'confirm-modal','save-player','save-class','toggle-mobile-nav',
         'open-discord-config','save-discord-config','test-discord-config',
         'connect-discord','logout-discord','confirm-onboarding','set-lang','check-unconnected'].includes(action)) {
      el.addEventListener('click', (e) => {
        handleClick(action, el, e);
      });
    }
    if (['filter-search','filter-class','filter-status','group-field','slot-select','form-input','form-checkbox'].includes(action)) {
      const evt = (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type==='date' || el.type==='time' || el.type==='color' || el.type==='number') ? 'change' : 'input';
      el.addEventListener(evt, (e) => handleInput(action, el, e));
    }
  });

  root.querySelectorAll('[data-stop]').forEach(el => el.addEventListener('click', (e) => e.stopPropagation()));
}

function handleClick(action, el, e){
  const id = el.getAttribute('data-id');
  switch(action){
    case 'toggle-mobile-nav': MOBILE_NAV_OPEN = !MOBILE_NAV_OPEN; render(); break;
    case 'nav': ACTIVE_TAB = el.getAttribute('data-tab'); MOBILE_NAV_OPEN = false; render(); break;
    case 'edit-player': openPlayerModal(id); break;
    case 'new-class': openClassModal(null); break;
    case 'edit-class': openClassModal(id); break;
    case 'delete-class': requestDeleteClass(id); break;
    case 'new-group': createGroup(el.getAttribute('data-type')); break;
    case 'delete-group': deleteGroup(el.getAttribute('data-group')); break;
    case 'publish-group': publishGroupToDiscord(el.getAttribute('data-group')); break;
    case 'open-event-kind': openEventKindModal(); break;
    case 'pick-event-kind': createEventWithKind(el.getAttribute('data-kind')); break;
    case 'remove-slot': removeSlotPlayer(el.getAttribute('data-group'), Number(el.getAttribute('data-slot'))); break;
    case 'close-modal': MODAL = null; render(); break;
    case 'confirm-modal': if (MODAL && MODAL.onConfirm) MODAL.onConfirm(); break;
    case 'save-player': savePlayerForm(); break;
    case 'save-class': saveClassForm(); break;
    case 'open-discord-config': openDiscordConfigModal(); break;
    case 'save-discord-config': saveDiscordConfig(); break;
    case 'test-discord-config': testDiscordConfig(); break;
    case 'connect-discord': connectWithDiscord(); break;
    case 'logout-discord': logoutDiscord(); break;
    case 'confirm-onboarding': confirmOnboarding(); break;
    case 'set-lang': setLang(el.getAttribute('data-lang')); break;
    case 'check-unconnected': checkUnconnectedMembers(); break;
  }
}

function handleInput(action, el, e){
  const val = el.value;
  switch(action){
    case 'filter-search': PLAYER_FILTERS.search = val; renderPreserveFocus(); break;
    case 'filter-class': PLAYER_FILTERS.classId = val; render(); break;
    case 'filter-status': PLAYER_FILTERS.status = val; render(); break;
    case 'group-field': {
      updateGroupField(el.getAttribute('data-group'), el.getAttribute('data-field'), val);
      if (document.activeElement === el && el.type === 'text') { renderKeepGroupFieldFocus(el); } else { render(); }
      break;
    }
    case 'slot-select': setSlotPlayer(el.getAttribute('data-group'), Number(el.getAttribute('data-slot')), val); break;
    case 'form-input': MODAL.form[el.getAttribute('data-field')] = val; MODAL.error=''; if(document.activeElement===el){renderKeepInputFocus(el);} else render(); break;
    case 'form-checkbox': MODAL.form[el.getAttribute('data-field')] = el.checked; render(); break;
  }
}

/* Preserve focus/caret for text search & modal text inputs while re-rendering */
function renderPreserveFocus(){
  const active = document.activeElement;
  const action = active && active.getAttribute ? active.getAttribute('data-action') : null;
  const selStart = active && active.selectionStart;
  render();
  if (action) {
    const el = document.querySelector(`[data-action="${action}"]`);
    if (el) { el.focus(); if (selStart!=null && el.setSelectionRange) { try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  }
}
function renderKeepInputFocus(sourceEl){
  const field = sourceEl.getAttribute('data-field');
  const selStart = sourceEl.selectionStart;
  render();
  const el = document.querySelector(`[data-field="${field}"][data-action="form-input"]`);
  if (el) { el.focus(); if (selStart!=null && el.setSelectionRange) { try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
}
function renderKeepGroupFieldFocus(sourceEl){
  const group = sourceEl.getAttribute('data-group');
  const field = sourceEl.getAttribute('data-field');
  const selStart = sourceEl.selectionStart;

function initApp(){
  render(); // affiche l'écran de chargement pendant la vérification de session
  checkSession().then(() => {
    handleDiscordLoginRedirect();
    if (SESSION_USER) {
      loadStateThenRender();
      startBackgroundSync();
    } else {
      render();
    }
  });
}

// Mises à jour en temps réel (Server-Sent Events) : permet de voir sur le
// site les inscriptions/désinscriptions faites depuis Discord (boutons
// Rejoindre/Quitter), les publications, etc. dès qu'elles arrivent, sans
// recharger la page. On applique les changements reçus seulement si aucune
// fenêtre n'est ouverte et qu'aucun champ n'est en cours de saisie, pour ne
// jamais interrompre une modification en cours.
let LIVE_EVENT_SOURCE = null;
const FALLBACK_POLL_INTERVAL_MS = 45000; // filet de sécurité si le flux temps réel se coupe

function applyLiveState(data){
  if (!data || MODAL) return;
  const active = document.activeElement;
  if (active && ['INPUT', 'SELECT', 'TEXTAREA'].includes(active.tagName)) return;
  PLAYERS = data.players || PLAYERS;
  CLASSES = (data.classes && data.classes.length) ? data.classes : CLASSES;
  GROUPS = data.groups || GROUPS;
  LAST_SAVE_STATUS = 'ok';
  renderUI();
}

function startBackgroundSync(){
  if (!DISCORD_API_BASE_URL || typeof EventSource === 'undefined') { startFallbackPolling(); return; }
  try {
    const es = new EventSource(`${DISCORD_API_BASE_URL.replace(/\/$/, '')}/api/events`, { withCredentials: true });
    es.onmessage = (evt) => {
      try { applyLiveState(JSON.parse(evt.data)); } catch (e) {}
    };
    es.onerror = () => { LAST_SAVE_STATUS = 'error'; };
    LIVE_EVENT_SOURCE = es;
  } catch (e) {
    startFallbackPolling();
  }
  // Filet de sécurité en complément (couvre le cas rare où le flux temps réel
  // se coupe silencieusement sans déclencher onerror).
  startFallbackPolling();
}

function startFallbackPolling(){
  setInterval(() => {
    if (!SESSION_USER || !DISCORD_API_BASE_URL || MODAL) return;
    const active = document.activeElement;
    if (active && ['INPUT', 'SELECT', 'TEXTAREA'].includes(active.tagName)) return;
    fetch(`${DISCORD_API_BASE_URL.replace(/\/$/, '')}/api/state`, { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(data => applyLiveState(data))
      .catch(() => {});
  }, FALLBACK_POLL_INTERVAL_MS);
}

initApp();

})();
